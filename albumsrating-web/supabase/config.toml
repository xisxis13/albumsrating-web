project_id = "albumsrating-web"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[functions.search-albums]
enabled = true
verify_jwt = false
import_map = "./functions/search-albums/deno.json"
entrypoint = "./functions/search-albums/index.ts"

[functions.add-album]
enabled = true
verify_jwt = false
import_map = "./functions/add-album/deno.json"
entrypoint = "./functions/add-album/index.ts"

[functions.get-album]
enabled = true
verify_jwt = false
import_map = "./functions/get-album/deno.json"
entrypoint = "./functions/get-album/index.ts"